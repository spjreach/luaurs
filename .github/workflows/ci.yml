name: CI

on:
  push:
  pull_request:

jobs:
  linux-macos-interpreter:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install GNU coreutils on macOS
        if: runner.os == 'macOS'
        run: brew install coreutils

      - name: Build Luau CLI (interpreter-only target)
        run: cargo build --release -p luau

      - name: Unit and API tests (interpreter)
        run: cargo test --release

      - name: Luau conformance (interpreter)
        env:
          LUAU_CODEGEN: "0"
        run: bash sweep.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust (x86_64-pc-windows-gnu)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Use the GNU toolchain
        shell: bash
        run: rustup default stable-x86_64-pc-windows-gnu

      - name: Build
        run: cargo build --release

      - name: Unit and API tests
        run: cargo test --release

      - name: Conformance (JIT and interpreter)
        shell: bash
        run: |
          set -o pipefail
          bash sweep.sh | tail -2
          LUAU_CODEGEN=0 bash sweep.sh | tail -2

      - name: JIT differential tests
        shell: bash
        run: bash tools/jitdiff.sh
