[package]
name = "luaurs"
description = "Embed Luau in Rust with a safe API (requires nightly Rust)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["luau", "lua", "scripting", "jit", "vm"]
categories = ["development-tools", "game-development", "compilers"]

[lib]
name = "luaurs"
path = "src/lib.rs"

[dependencies]
luau-common = { version = "0.1.0", path = "../luau-common" }
luau-compiler = { version = "0.1.0", path = "../luau-compiler" }
luau-rt = { version = "0.1.0", path = "../luau-rt" }
