[package]
name = "luau"
description = "Luau CLI for running, compiling, and exploring scripts (requires nightly Rust)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "luau"
path = "src/main.rs"

[[bin]]
name = "luau-compile"
path = "src/compile_main.rs"

[dependencies]
luau-common = { version = "0.1.0", path = "../luau-common" }
luau-ast = { version = "0.1.0", path = "../luau-ast" }
luau-compiler = { version = "0.1.0", path = "../luau-compiler" }
luau-rt = { version = "0.1.0", path = "../luau-rt" }
luau-config = { version = "0.1.0", path = "../luau-config" }
luau-require = { version = "0.1.0", path = "../luau-require" }
