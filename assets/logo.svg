<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="luaurs: Luau in Rust">
  <title>luaurs: Luau in Rust</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1726"/>
      <stop offset="1" stop-color="#152238"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FC3FF"/>
      <stop offset="0.6" stop-color="#1A8CFF"/>
      <stop offset="1" stop-color="#F0703A"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="36" fill="url(#bg)"/>
  <svg x="40" y="24" width="272" height="272" viewBox="0 0 512 512">
  
  <defs>
    <linearGradient id="i_luau" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FC3FF"/>
      <stop offset="0.55" stop-color="#1A8CFF"/>
      <stop offset="1" stop-color="#2C5BD6"/>
    </linearGradient>
    <linearGradient id="i_rust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0703A"/>
      <stop offset="1" stop-color="#B7410E"/>
    </linearGradient>
    <linearGradient id="i_shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- gear ring: 16 teeth around a band -->
  <g fill="url(#i_rust)">
    <g id="i_tooth">
      <rect x="241" y="20" width="30" height="46" rx="6"/>
    </g>
    <use href="#i_tooth" transform="rotate(22.5 256 256)"/>
    <use href="#i_tooth" transform="rotate(45 256 256)"/>
    <use href="#i_tooth" transform="rotate(67.5 256 256)"/>
    <use href="#i_tooth" transform="rotate(90 256 256)"/>
    <use href="#i_tooth" transform="rotate(112.5 256 256)"/>
    <use href="#i_tooth" transform="rotate(135 256 256)"/>
    <use href="#i_tooth" transform="rotate(157.5 256 256)"/>
    <use href="#i_tooth" transform="rotate(180 256 256)"/>
    <use href="#i_tooth" transform="rotate(202.5 256 256)"/>
    <use href="#i_tooth" transform="rotate(225 256 256)"/>
    <use href="#i_tooth" transform="rotate(247.5 256 256)"/>
    <use href="#i_tooth" transform="rotate(270 256 256)"/>
    <use href="#i_tooth" transform="rotate(292.5 256 256)"/>
    <use href="#i_tooth" transform="rotate(315 256 256)"/>
    <use href="#i_tooth" transform="rotate(337.5 256 256)"/>
  </g>
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#i_rust)" stroke-width="34"/>
  <circle cx="256" cy="256" r="180" fill="#0E1726"/>

  <!-- the Luau mark: a tilted square with its small companion square -->
  <g transform="rotate(-16 256 256)">
    <rect x="152" y="168" width="196" height="196" rx="26" fill="url(#i_luau)"/>
    <rect x="152" y="168" width="196" height="196" rx="26" fill="url(#i_shine)"/>
    <rect x="294" y="112" width="52" height="52" rx="10" fill="#FFFFFF"/>
  </g>

  <!-- speed lines: the JIT -->
  <g stroke="#4FC3FF" stroke-width="12" stroke-linecap="round" opacity="0.85">
    <line x1="128" y1="356" x2="178" y2="356"/>
    <line x1="146" y1="382" x2="214" y2="382"/>
  </g>
</svg>
  <text x="344" y="172" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="132" font-weight="800" fill="url(#word)" letter-spacing="-2">luaurs</text>
  <text x="350" y="236" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="500" fill="#A9B8D0">Luau in Rust: compiler, VM and an x64 JIT</text>
</svg>
